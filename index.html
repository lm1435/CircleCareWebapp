<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Theme (dark mode). public/theme-init.js runs BEFORE first paint and rewrites
         color-scheme, theme-color and <html data-theme>; src/lib/themeCore.ts keeps
         them in sync afterwards. The values here are the no-JS / flag-off fallback.
         `cc-dark-mode` carries the build flag (vite.config.ts replaces the token). -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1815" media="(prefers-color-scheme: dark)" />
    <meta name="cc-dark-mode" content="__CC_DARK_MODE__" />
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CircleCare — Care for them together</title>
    <meta
      name="description"
      content="CircleCare brings families together to coordinate care — a shared calendar, medications everyone can confirm, and who's doing what. So no one carries it alone."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CircleCare" />
    <meta property="og:title" content="CircleCare — Care for them together" />
    <meta
      property="og:description"
      content="CircleCare brings families together to coordinate care — a shared calendar, medications everyone can confirm, and who's doing what. So no one carries it alone."
    />
    <meta property="og:image" content="https://my.circlecare.app/og-invite-en.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Invitation to a care circle — free for you, no download needed. The CircleCare activity feed shown on a phone."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_419" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="fr_CA" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="it_IT" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:locale:alternate" content="pt_PT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CircleCare — Care for them together" />
    <meta
      name="twitter:description"
      content="CircleCare brings families together to coordinate care — a shared calendar, medications everyone can confirm, and who's doing what. So no one carries it alone."
    />
    <meta name="twitter:image" content="https://my.circlecare.app/og-invite-en.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
